name: Build NovaDeck Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK Platform, CMake, and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMAN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            unzip -q -o /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.NOVADECK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/novadeck-release.jks
          elif [ ! -f app/novadeck-release.jks ]; then
            keytool -genkeypair -v \
              -keystore app/novadeck-release.jks \
              -alias "${{ secrets.NOVADECK_KEY_ALIAS || 'novadeck' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.NOVADECK_STORE_PASS || 'novadeck2026' }}" \
              -keypass "${{ secrets.NOVADECK_KEY_PASS || 'novadeck2026' }}" \
              -dname "CN=NovaDeck, OU=Telemetry, O=NovaDeck, L=Offline, S=None, C=US"
          fi

      - name: Build Debug & R8 Release APKs
        env:
          NOVADECK_KEYSTORE: novadeck-release.jks
          NOVADECK_STORE_PASS: ${{ secrets.NOVADECK_STORE_PASS || 'novadeck2026' }}
          NOVADECK_KEY_ALIAS: ${{ secrets.NOVADECK_KEY_ALIAS || 'novadeck' }}
          NOVADECK_KEY_PASS: ${{ secrets.NOVADECK_KEY_PASS || 'novadeck2026' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Package APK outputs and SHA-256
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NovaDeck-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/NovaDeck-release.apk
          (cd dist && sha256sum NovaDeck-release.apk > NovaDeck-release.apk.sha256)
          (cd dist && sha256sum NovaDeck-debug.apk > NovaDeck-debug.apk.sha256)
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaDeck-APKs
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          name: NovaDeck ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/NovaDeck-release.apk
            dist/NovaDeck-release.apk.sha256
            dist/NovaDeck-debug.apk
            dist/NovaDeck-debug.apk.sha256
